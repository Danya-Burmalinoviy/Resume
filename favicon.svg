<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- фон -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <!-- блик по фону -->
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- лист -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <!-- тень листа -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- подложка -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>

  <!-- декоративные точки (тонкий паттерн) -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="8"  cy="8"  r="1.1"/>
    <circle cx="12" cy="6"  r="0.9"/>
    <circle cx="6"  cy="14" r="0.9"/>
    <circle cx="56" cy="10" r="1"/>
    <circle cx="58" cy="16" r="0.8"/>
    <circle cx="54" cy="5"  r="0.8"/>
  </g>

  <!-- лист документа с тенью -->
  <g filter="url(#shadow)">
    <path d="M20 11h17l10 10v28a5 5 0 0 1-5 5H20a5 5 0 0 1-5-5V16a5 5 0 0 1 5-5z"
          fill="url(#paper)"/>
    <!-- загнутый уголок -->
    <path d="M37 11l10 10H37z" fill="#C7D2FE"/>
    <path d="M37 11l10 10h-3l-7-7z" fill="#A5B4FC"/>
  </g>

  <!-- акцентная «закладка» слева -->
  <rect x="18" y="11" width="3" height="15" rx="1.5" fill="#F59E0B"/>

  <!-- фото-кружок -->
  <circle cx="27" cy="27" r="6.5" fill="#E0E7FF"/>
  <circle cx="27" cy="25" r="2.4" fill="#6366F1"/>
  <path d="M22.5 32.5c.9-2.2 2.6-3.4 4.5-3.4s3.6 1.2 4.5 3.4a6.5 6.5 0 0 1-9 0z" fill="#6366F1"/>

  <!-- строки «опыта» -->
  <rect x="36" y="24" width="9" height="2.6" rx="1.3" fill="#4F46E5"/>
  <rect x="36" y="29" width="7" height="2.6" rx="1.3" fill="#818CF8"/>

  <rect x="21" y="38" width="23" height="2.6" rx="1.3" fill="#4338CA"/>
  <rect x="21" y="43" width="18" height="2.6" rx="1.3" fill="#6366F1"/>
  <rect x="21" y="48" width="11" height="2.6" rx="1.3" fill="#A5B4FC"/>

  <!-- бейдж-галочка «проверено» -->
  <g>
    <circle cx="49" cy="49" r="8.5" fill="#10B981" stroke="#ffffff" stroke-width="2"/>
    <path d="M45.2 49.2l2.4 2.4 4.6-4.8" fill="none" stroke="#ffffff"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- искра -->
  <g fill="#FDE68A">
    <path d="M52 9l1.1 3.1L56 13l-2.9 1.1L52 17l-1.1-2.9L48 13l2.9-.9z"/>
  </g>
</svg>